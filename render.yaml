services:
  - type: web
    name: prepkit-api
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=@jobprep/shared && npm run build --workspace=@jobprep/api
    startCommand: node apps/api/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
