version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: prepkit-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: jobprep

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: prepkit-api
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/jobprep
      JWT_SECRET: ${JWT_SECRET:-production_jwt_secret_key_change_me_123}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      - mongodb

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: prepkit-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    depends_on:
      - api

volumes:
  mongo-data:
